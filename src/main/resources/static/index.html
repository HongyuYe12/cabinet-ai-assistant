<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 橱柜方案助手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="intro"><p class="eyebrow">Cabinet AI</p><h1>橱柜方案助手</h1><p>输入厨房尺寸和偏好，生成可复尺确认的初步方案。</p></section>
    <section class="panel">
      <form id="design-form">
        <label>预算 (元)<input name="budget" type="number" value="20000" min="5000" required></label>
        <label>风格<input name="style" value="现代简约"></label>
        <label class="wide">厨房DXF图纸<input name="cadFile" type="file" accept=".dxf" required></label>
        <fieldset class="wide"><legend>需要的电器（勾选后填写尺寸）</legend>
          <label class="check"><input type="checkbox" data-appliance="dishwasher"> 洗碗机</label><input class="appliance-size" data-for="dishwasher" name="dishwasher" placeholder="宽×深×高(mm)" hidden>
          <label class="check"><input type="checkbox" data-appliance="oven"> 烤箱</label><input class="appliance-size" data-for="oven" name="oven" placeholder="宽×深×高(mm)" hidden>
          <label class="check"><input type="checkbox" data-appliance="steamOven"> 蒸箱</label><input class="appliance-size" data-for="steamOven" name="steamOven" placeholder="宽×深×高(mm)" hidden>
          <label class="check"><input type="checkbox" data-appliance="refrigerator"> 冰箱</label><input class="appliance-size" data-for="refrigerator" name="refrigerator" placeholder="宽×深×高(mm)" hidden>
          <label class="check"><input type="checkbox" data-appliance="hood"> 油烟机</label><input class="appliance-size" data-for="hood" name="hood" placeholder="宽×深×高(mm)" hidden>
        </fieldset>
        <button type="submit">生成初步方案</button>
        <button type="button" id="ai-button" class="secondary">AI设计建议</button>
      </form>
    </section>
    <section id="result" class="panel result" hidden></section>
    <section id="ai-result" class="panel result" hidden></section>
    <section id="cad-result" class="panel result" hidden></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
